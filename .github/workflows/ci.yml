name: CI

# Two jobs, and the split is deliberate: every push and every pull request gets
# checked, and only master gets published. Before this, nothing checked a change
# on the way in and nothing had ever published a build - there was no gh-pages
# branch and the Pages URL answered 404. See ROADMAP 1.10.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push that lands while another is deploying supersedes it, but a run that
  # is already publishing is left to finish - a half-uploaded Pages artifact is
  # worse than a slightly stale one.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22.15 is the floor package.json sets, which webpack-dev-server@6 is
      # what raised. 24 is what the project is developed against.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than install: the lockfile pins oni-save-parser to a
      # commit on the fork, and this should fail loudly if the two disagree.
      - run: npm ci

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # Deliberately the same command a developer runs: `npm run test:e2e` is
      # `docker compose run --rm e2e`, so this checks the path people actually
      # use rather than a parallel one that could drift from it. The suite runs
      # inside mcr.microsoft.com/playwright, which is what lets a single set of
      # baselines serve every machine - see docker-compose.yml.
      #
      # It costs an `npm ci` inside the container on top of the one above,
      # because the container has its own node_modules. That is about forty
      # seconds, and it buys one way to run the screenshots instead of two.
      - run: npm run test:e2e

      - name: Upload the failed screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Package the site
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Pages has to be switched on by hand once, at
    # Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions".
    # `actions/configure-pages` with `enablement: true` was here to spare
    # anybody that, and it cannot: GITHUB_TOKEN is not allowed to create the
    # Pages site, so the step failed and took the deploy with it. One switch,
    # once, is better than a step that always fails until somebody flips it.
    steps:
      # Publishes the artifact directly rather than committing a build to a
      # gh-pages branch, which suits a dist/ that is already gitignored. It
      # also means Jekyll never runs over the output, so nothing beginning with
      # an underscore goes missing.
      - id: deployment
        uses: actions/deploy-pages@v4
